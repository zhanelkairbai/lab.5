<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
</head>
<body>

    <h1>Мой список задач</h1>

    <input type="text" id="taskInput" placeholder="Введите задачу">
    <button onclick="addTask()">Добавить</button>

    <ul id="taskList"></ul>

    <p>Выполнено: <span id="completedCount">0</span></p>
    <p>Не выполнено: <span id="uncompletedCount">0</span></p>

    <script>
        let tasks = [];

        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();

            if (text === "") {
                alert("Введите задачу.");
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            input.value = "";

            showTasks();
        }

        function showTasks() {
            const list = document.getElementById("taskList");

            list.innerHTML = "";

            let completed = 0;

            for (let i = 0; i < tasks.length; i++) {
                const li = document.createElement("li");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = tasks[i].completed;

                checkbox.onchange = function() {
                    tasks[i].completed = checkbox.checked;
                    showTasks();
                };

                const text = document.createElement("span");
                text.textContent = " " + tasks[i].text + " ";

                if (tasks[i].completed) {
                    text.style.textDecoration = "line-through";
                    completed++;
                }

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Удалить";

                deleteButton.onclick = function() {
                    tasks.splice(i, 1);
                    showTasks();
                };

                li.appendChild(checkbox);
                li.appendChild(text);
                li.appendChild(deleteButton);

                list.appendChild(li);
            }

            document.getElementById("completedCount").textContent = completed;
            document.getElementById("uncompletedCount").textContent =
                tasks.length - completed;
        }
    </script>

</body>
</html>
